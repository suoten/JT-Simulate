name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build binary
      run: go build -o jt-simulate ./cmd/jt-simulate

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jt-simulate-linux
        path: jt-simulate

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows binary
      run: go build -o jt-simulate.exe ./cmd/jt-simulate

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jt-simulate-windows
        path: jt-simulate.exe

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t jt-simulate .
